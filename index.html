<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Touch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    :root {
      --ink: #24221f;
      --muted: #76716b;
      --paper: #f5f1e8;
      --panel: rgba(255, 253, 248, 0.82);
      --line: rgba(54, 47, 40, 0.14);
      --blue: #2563eb;
      --blue-dark: #1745ab;
      --red: #c93f3f;
      --shadow: 0 24px 60px rgba(56, 47, 34, 0.12);
      --board-size: 50vw;
      --captures-width: 52px;
    }

    * {
      box-sizing: border-box;
    }

    [x-cloak] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(240, 193, 121, 0.28), transparent 32rem),
        radial-gradient(circle at 100% 25%, rgba(91, 130, 190, 0.18), transparent 36rem),
        var(--paper);
      font-family: "DM Sans", sans-serif;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(440px, 2fr) minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      align-items: center;
      gap: 6px;
      padding: 0;
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 8px;
      justify-self: start;
    }

    .brand-menu {
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: white;
      background: var(--ink);
      border-radius: 11px;
      font-size: 23px;
      line-height: 1;
      box-shadow: 0 8px 22px rgba(36, 34, 31, 0.18);
    }

    .brand h1 {
      margin: 0;
      font-family: "DM Serif Display", serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .brand p {
      display: none;
    }

    .brand-chevron {
      margin-left: 2px;
      color: var(--muted);
      font-size: 13px;
      transition: transform 160ms ease;
    }

    .brand-chevron.open {
      transform: rotate(180deg);
    }

    .title-menu {
      position: absolute;
      z-index: 30;
      top: calc(100% + 7px);
      left: 0;
      min-width: 190px;
      padding: 5px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.98);
      border-radius: 12px;
      box-shadow: 0 14px 32px rgba(36, 34, 31, 0.18);
      backdrop-filter: blur(16px);
    }

    .menu-item {
      display: flex;
      width: 100%;
      min-height: 40px;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 0;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-align: left;
      transition: 160ms ease;
    }

    .menu-item:hover {
      color: var(--blue);
      background: rgba(37, 99, 235, 0.08);
    }

    .control-deck {
      display: grid;
      width: 100%;
      grid-template-columns: minmax(140px, 1fr) auto minmax(140px, 1fr);
      gap: 6px;
      align-items: center;
      justify-self: center;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(56, 47, 34, 0.08);
      backdrop-filter: blur(18px);
    }

    .clock {
      --time-ratio: 1;
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: auto 1fr;
      min-width: 0;
      overflow: hidden;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      border-radius: 10px;
      transition: 180ms ease;
    }

    .clock::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      content: "";
      background: rgba(37, 99, 235, 0.18);
      transform: scaleX(var(--time-ratio));
      transform-origin: left center;
      transition: transform 100ms linear, background-color 180ms ease;
    }

    .clock > * {
      position: relative;
      z-index: 1;
    }

    .clock.active::before {
      background: rgba(34, 197, 94, 0.28);
    }

    .clock.active {
      border-color: rgba(22, 163, 74, 0.52);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.08);
    }

    .clock.flagged {
      border-color: rgba(201, 63, 63, 0.54);
      background: rgba(255, 233, 229, 0.92);
      animation: flag-pulse 1.8s infinite;
    }

    @keyframes flag-pulse {
      50% { box-shadow: 0 0 0 7px rgba(201, 63, 63, 0.08); }
    }

    .clock-player {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .player-dot {
      width: 11px;
      height: 11px;
      flex: none;
      border: 2px solid #d4d0ca;
      background: #fff;
      border-radius: 50%;
    }

    .clock.black .player-dot {
      border-color: #292724;
      background: #292724;
    }

    .clock-time {
      min-width: 76px;
      font-size: clamp(24px, 2.1vw, 32px);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      text-align: right;
    }

    .clock.flagged .clock-time {
      color: var(--red);
    }

    .clock.flagged .clock-player::after {
      content: "Flagged";
      color: var(--red);
      font-size: 10px;
    }

    .clock-controls {
      display: flex;
      order: 2;
      align-items: center;
      gap: 4px;
    }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
      transition: 160ms ease;
    }

    .icon-button:hover {
      border-color: rgba(37, 99, 235, 0.4);
      color: var(--blue);
      transform: translateY(-1px);
    }

    .fullscreen-button {
      position: fixed;
      z-index: 25;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 24px rgba(56, 47, 34, 0.1);
      backdrop-filter: blur(12px);
    }

    .fullscreen-button.active {
      border-color: rgba(37, 99, 235, 0.4);
      color: var(--blue);
    }

    .mode-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 4px 54px 4px 8px;
      justify-self: end;
    }

    .field-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .field-label {
      margin-right: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .select-wrap {
      position: relative;
    }

    select,
    .number-input {
      height: 38px;
      border: 1px solid var(--line);
      outline: none;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      color: var(--ink);
      font-weight: 600;
    }

    select {
      min-width: 158px;
      padding: 0 38px 0 13px;
      appearance: none;
      cursor: pointer;
    }

    .select-wrap::after {
      position: absolute;
      top: 50%;
      right: 13px;
      content: "⌄";
      pointer-events: none;
      transform: translateY(-58%);
    }

    .custom-time {
      display: none;
      align-items: center;
      gap: 7px;
    }

    .custom-time.visible {
      display: flex;
    }

    .number-input {
      width: 72px;
      padding: 0 10px;
    }

    .number-unit {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .segmented {
      display: inline-flex;
      padding: 4px;
      background: rgba(229, 225, 216, 0.7);
      border-radius: 14px;
    }

    .segment {
      min-height: 35px;
      padding: 0 14px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: 160ms ease;
    }

    .segment.active {
      color: var(--ink);
      background: white;
      box-shadow: 0 3px 11px rgba(54, 47, 40, 0.09);
    }

    .boards-stage {
      display: grid;
      grid-template-columns: repeat(2, calc(var(--board-size) + var(--captures-width)));
      grid-column: 1 / -1;
      gap: 0;
      align-items: center;
      justify-content: center;
      justify-items: center;
      min-height: 0;
      padding: 0;
    }

    .board-column {
      display: grid;
      width: calc(var(--board-size) + var(--captures-width));
      height: var(--board-size);
      grid-template-columns: var(--captures-width) var(--board-size);
      align-items: stretch;
    }

    .board-column.tray-right {
      grid-template-columns: var(--board-size) var(--captures-width);
    }

    .board-column.tray-right .board-shell {
      grid-column: 1;
      grid-row: 1;
    }

    .board-column.tray-right .captures-panel {
      grid-column: 2;
      grid-row: 1;
    }

    .board-shell {
      width: var(--board-size);
      height: var(--board-size);
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      transition: transform 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .board {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .board > .board-b72b1 {
      border: 0;
    }

    .board img {
      -webkit-user-drag: none;
    }

    .dragged-piece {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      transform-origin: center;
    }

    .board-shell.rotate-90 {
      transform: rotate(90deg);
    }

    .board-shell.rotate-neg-90 {
      transform: rotate(270deg);
    }

    .board-shell.rotate-180 {
      transform: rotate(180deg);
    }

    .board .white-1e1d7 {
      background-color: #f0d9b5;
    }

    .board .black-3c85d {
      background-color: #9a6e53;
    }

    .board .square-55d63 {
      position: relative;
      cursor: pointer;
    }

    .board .square-55d63.last-move {
      background-image: linear-gradient(rgba(249, 224, 92, 0.48), rgba(249, 224, 92, 0.48));
    }

    .board .square-55d63.selected-square {
      box-shadow: inset 0 0 0 5px rgba(40, 104, 213, 0.78);
    }

    .board .square-55d63.valid-move::after {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: 24%;
      height: 24%;
      content: "";
      pointer-events: none;
      background: rgba(30, 90, 183, 0.62);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .board .square-55d63.valid-capture::after {
      position: absolute;
      z-index: 5;
      inset: 7%;
      content: "";
      pointer-events: none;
      border: 5px solid rgba(30, 90, 183, 0.66);
      border-radius: 50%;
    }

    .board .square-55d63 > img {
      position: relative;
      z-index: 2;
    }

    .board .square-55d63.king-in-check::before {
      position: absolute;
      z-index: 1;
      inset: -18%;
      content: "";
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 52, 52, 0.92) 0 19%, rgba(218, 28, 28, 0.7) 33%, rgba(201, 31, 31, 0.3) 52%, transparent 70%);
      animation: check-bloom 1.35s ease-in-out infinite;
    }

    @keyframes check-bloom {
      50% {
        opacity: 0.68;
        transform: scale(0.88);
      }
    }

    .board .square-55d63.mating-king::after,
    .board .square-55d63.losing-king::after {
      position: absolute;
      z-index: 6;
      top: 4%;
      right: 3%;
      display: grid;
      width: 34%;
      height: 34%;
      content: "♛";
      place-items: center;
      pointer-events: none;
      border: 2px solid rgba(255, 255, 255, 0.9);
      color: #fff;
      background: #16803c;
      border-radius: 50%;
      box-shadow: 0 3px 9px rgba(16, 76, 39, 0.42);
      font-size: clamp(10px, 1.2vw, 18px);
      line-height: 1;
    }

    .board .square-55d63.losing-king::after {
      content: "×";
      background: var(--red);
      box-shadow: 0 3px 9px rgba(132, 27, 27, 0.42);
      font-family: "DM Sans", sans-serif;
      font-weight: 700;
    }

    .captures-panel {
      --piece-rotation: 0deg;
      position: relative;
      display: grid;
      min-width: 0;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      padding: 8px 6px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.72);
      box-shadow: 0 8px 24px rgba(56, 47, 34, 0.07);
      backdrop-filter: blur(12px);
    }

    .captures-panel::after {
      position: absolute;
      top: 50%;
      right: 6px;
      left: 6px;
      height: 1px;
      content: "";
      pointer-events: none;
      background: var(--line);
    }

    .captures-panel.tray-left {
      border-right: 0;
      border-radius: 12px 0 0 12px;
    }

    .captures-panel.tray-right {
      border-left: 0;
      border-radius: 0 12px 12px 0;
    }

    .captures-group {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
    }

    .captures-group.captured-white {
      grid-row: 1;
      align-items: flex-end;
    }

    .captures-group.captured-black {
      grid-row: 2;
      align-items: flex-start;
    }

    .captures-panel.colors-swapped .captures-group.captured-white {
      grid-row: 2;
      align-items: flex-start;
    }

    .captures-panel.colors-swapped .captures-group.captured-black {
      grid-row: 1;
      align-items: flex-end;
    }

    .captures-pieces {
      display: flex;
      min-height: 0;
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
    }

    .captured-piece-image {
      width: clamp(9px, calc(var(--board-size) / 24), 20px);
      height: clamp(9px, calc(var(--board-size) / 24), 20px);
      flex: 0 0 auto;
      object-fit: contain;
      transform: rotate(var(--piece-rotation));
      transition: transform 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .captures-empty {
      color: rgba(118, 113, 107, 0.48);
      font-family: "DM Sans", sans-serif;
      font-size: 15px;
    }

    @media (max-width: 1200px) {
      .app {
        grid-template-columns: 1fr auto;
      }

      .control-deck {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-self: center;
      }

      .boards-stage {
        grid-row: 3;
      }
    }

    @media (max-width: 680px) {
      :root {
        --captures-width: 40px;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .topbar {
        grid-row: 1;
      }

      .control-deck {
        grid-row: 2;
        gap: 4px;
      }

      .clock {
        padding: 7px;
      }

      .clock-player {
        gap: 4px;
        font-size: 10px;
      }

      .clock-time {
        min-width: 62px;
        font-size: clamp(22px, 7vw, 30px);
      }

      .mode-row {
        grid-row: 3;
        justify-content: center;
      }

      .boards-stage {
        grid-row: 4;
      }
    }
  </style>
</head>
<body>
  <main class="app" x-data="chessTouchUi">
    <header class="topbar">
      <div class="brand-menu">
        <button
          class="brand"
          type="button"
          @click="menuOpen = !menuOpen"
          :aria-expanded="menuOpen"
          aria-haspopup="menu"
        >
          <div class="brand-mark" aria-hidden="true">♞</div>
          <div>
            <h1>Chess Touch</h1>
            <p>One game · Two perspectives</p>
          </div>
          <span class="brand-chevron" :class="{ open: menuOpen }" aria-hidden="true">⌄</span>
        </button>
        <div
          class="title-menu"
          role="menu"
          x-cloak
          x-show="menuOpen"
          x-transition.opacity.duration.150ms
          @click.outside="menuOpen = false"
          @keydown.escape.window="menuOpen = false"
        >
          <button class="menu-item" id="restartGame" type="button" role="menuitem" @click="menuOpen = false">
            <span aria-hidden="true">↻</span>
            Restart game
          </button>
          <button
            class="menu-item"
            id="swapSides"
            type="button"
            role="menuitem"
            aria-pressed="false"
            @click="menuOpen = false"
          >
            <span aria-hidden="true">⇄</span>
            Swap Black / White positions
          </button>
        </div>
      </div>
    </header>

    <button
      class="icon-button fullscreen-button"
      id="fullscreenButton"
      type="button"
      aria-label="Enter fullscreen"
      title="Enter fullscreen"
    >⛶</button>

    <section class="control-deck" aria-label="Chess clocks">
      <template x-for="clock in clocks" :key="clock.id">
        <div class="clock" :class="clock.color" :id="clock.id" :style="{ order: clock.order }">
          <div class="clock-player"><span class="player-dot"></span><span x-text="clock.label"></span></div>
          <div class="clock-time" :id="clock.timeId">05:00</div>
        </div>
      </template>

      <div class="clock-controls">
        <button class="icon-button" id="pauseClock" type="button" aria-label="Pause clock" title="Pause clock">Ⅱ</button>
        <button class="icon-button" id="resetClock" type="button" aria-label="Reset clock" title="Reset clock">↺</button>
      </div>
    </section>

    <section class="mode-row" aria-label="Game settings">
      <div class="field-group">
        <div class="select-wrap">
          <select id="timeMode" aria-label="Clock mode">
            <option value="1|0">Bullet · 1 min</option>
            <option value="3|0">Blitz · 3 min</option>
            <option value="3|2">Blitz · 3 + 2</option>
            <option value="5|0" selected>Blitz · 5 min</option>
            <option value="10|0">Rapid · 10 min</option>
            <option value="15|10">Rapid · 15 + 10</option>
            <option value="30|0">Classical · 30 min</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="custom-time" id="customTime">
          <input class="number-input" id="customMinutes" type="number" min="1" max="180" value="10" aria-label="Custom minutes">
          <span class="number-unit">min</span>
          <input class="number-input" id="customIncrement" type="number" min="0" max="60" value="0" aria-label="Custom increment seconds">
          <span class="number-unit">sec inc.</span>
        </div>
      </div>
      <div class="field-group">
        <div class="segmented" role="group" aria-label="Board layout">
          <template x-for="option in layouts" :key="option.value">
            <button
              class="segment"
              :class="{ active: option.value === 'opposed' }"
              type="button"
              :data-layout="option.value"
              x-text="option.label"
            ></button>
          </template>
        </div>
      </div>
    </section>

    <section class="boards-stage">
      <template x-for="board in boardViews" :key="board.id">
        <div class="board-column" :class="{ 'tray-right': board.traySide === 'right' }">
          <aside
            class="captures-panel"
            :class="`tray-${board.traySide}`"
            :id="board.capturesId"
            :aria-label="`Captured pieces beside ${board.label}`"
          >
            <div class="captures-group captured-white">
              <div class="captures-pieces" :id="`${board.id}BlackCaptures`"><span class="captures-empty">—</span></div>
            </div>
            <div class="captures-group captured-black">
              <div class="captures-pieces" :id="`${board.id}WhiteCaptures`"><span class="captures-empty">—</span></div>
            </div>
          </aside>
          <div class="board-shell" :class="board.shellClass" :id="board.shellId">
            <div class="board" :id="board.id"></div>
          </div>
        </div>
      </template>
    </section>

  </main>

  <script>
    document.addEventListener("alpine:init", () => {
      Alpine.data("chessTouchUi", () => ({
        menuOpen: false,
        clocks: [
          { id: "whiteClock", timeId: "whiteTime", label: "White", color: "white", order: 1 },
          { id: "blackClock", timeId: "blackTime", label: "Black", color: "black", order: 3 }
        ],
        layouts: [
          { value: "opposed", label: "Opposed" },
          { value: "sideways", label: "Sideways" }
        ],
        boardViews: [
          { id: "boardLeft", label: "left board", traySide: "left", capturesId: "leftCaptures", shellId: "leftShell", shellClass: "" },
          { id: "boardRight", label: "right board", traySide: "right", capturesId: "rightCaptures", shellId: "rightShell", shellClass: "rotate-180" }
        ]
      }));
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script>
    document.addEventListener("alpine:initialized", () => {
      const game = new Chess();
      const boardIds = ["boardLeft", "boardRight"];
      const pieceTheme = "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png";
      const pieceNames = { p: "pawn", n: "knight", b: "bishop", r: "rook", q: "queen" };
      const pieceValueOrder = ["q", "r", "b", "n", "p"];
      let boards = [];
      let selectedSquare = null;
      let selectedBoardId = null;
      let legalTargets = [];
      let layout = "opposed";
      let sidesSwapped = false;
      let pointerDrag = null;

      const clock = {
        initialMs: 5 * 60 * 1000,
        incrementMs: 0,
        remaining: { w: 5 * 60 * 1000, b: 5 * 60 * 1000 },
        flagged: { w: false, b: false },
        active: null,
        running: false,
        started: false,
        lastTick: null,
        timer: null
      };

      const elements = {
        leftShell: document.getElementById("leftShell"),
        rightShell: document.getElementById("rightShell"),
        leftCaptures: document.getElementById("leftCaptures"),
        rightCaptures: document.getElementById("rightCaptures"),
        whiteClock: document.getElementById("whiteClock"),
        blackClock: document.getElementById("blackClock"),
        whiteTime: document.getElementById("whiteTime"),
        blackTime: document.getElementById("blackTime"),
        fullscreenButton: document.getElementById("fullscreenButton"),
        swapSides: document.getElementById("swapSides"),
        pauseClock: document.getElementById("pauseClock"),
        timeMode: document.getElementById("timeMode"),
        customTime: document.getElementById("customTime"),
        customMinutes: document.getElementById("customMinutes"),
        customIncrement: document.getElementById("customIncrement")
      };

      function squareFromElement(element) {
        const square = element.closest(".square-55d63");
        if (!square) return null;
        const squareClass = Array.from(square.classList).find((name) => /^square-[a-h][1-8]$/.test(name));
        return squareClass ? squareClass.slice(7) : null;
      }

      function updateFullscreenButton() {
        const active = Boolean(document.fullscreenElement);
        const label = active ? "Exit fullscreen" : "Enter fullscreen";
        elements.fullscreenButton.classList.toggle("active", active);
        elements.fullscreenButton.setAttribute("aria-label", label);
        elements.fullscreenButton.setAttribute("title", label);
      }

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error("Unable to change fullscreen mode.", error);
        }
      }

      function clearHighlights() {
        document.querySelectorAll(".selected-square, .valid-move, .valid-capture").forEach((square) => {
          square.classList.remove("selected-square", "valid-move", "valid-capture");
        });
      }

      function paintHighlights() {
        clearHighlights();
        if (!selectedSquare || !selectedBoardId) return;

        const root = document.getElementById(selectedBoardId);
        root.querySelector(`.square-${selectedSquare}`)?.classList.add("selected-square");
        legalTargets.forEach(({ to, captured }) => {
          root.querySelector(`.square-${to}`)?.classList.add(captured ? "valid-capture" : "valid-move");
        });
      }

      function selectSquare(square, boardId) {
        const piece = game.get(square);
        if (!piece || piece.color !== game.turn()) {
          selectedSquare = null;
          selectedBoardId = null;
          legalTargets = [];
          paintHighlights();
          return;
        }

        selectedSquare = square;
        selectedBoardId = boardId;
        legalTargets = game.moves({ square, verbose: true });
        paintHighlights();
      }

      function completeMove(source, target) {
        const movingColor = game.turn();
        const move = game.move({ from: source, to: target, promotion: "q" });
        if (!move) return false;

        boards.forEach((board) => board.position(game.fen(), false));
        selectedSquare = null;
        selectedBoardId = null;
        legalTargets = [];
        window.setTimeout(paintHighlights, 0);
        advanceClock(movingColor);
        updateStatus();
        return true;
      }

      function findKingSquare(color) {
        for (const file of "abcdefgh") {
          for (let rank = 1; rank <= 8; rank += 1) {
            const square = `${file}${rank}`;
            const piece = game.get(square);
            if (piece?.type === "k" && piece.color === color) return square;
          }
        }
        return null;
      }

      function paintGameMarkers() {
        document.querySelectorAll(".king-in-check, .mating-king, .losing-king").forEach((square) => {
          square.classList.remove("king-in-check", "mating-king", "losing-king");
        });

        if (game.in_check()) {
          const checkedKing = findKingSquare(game.turn());
          if (checkedKing) {
            boardIds.forEach((boardId) => {
              document.getElementById(boardId).querySelector(`.square-${checkedKing}`)?.classList.add("king-in-check");
            });
          }
        }

        if (game.in_checkmate()) {
          const winner = game.turn() === "w" ? "b" : "w";
          const winningKing = findKingSquare(winner);
          const losingKing = findKingSquare(game.turn());
          if (winningKing) {
            boardIds.forEach((boardId) => {
              document.getElementById(boardId).querySelector(`.square-${winningKing}`)?.classList.add("mating-king");
            });
          }
          if (losingKing) {
            boardIds.forEach((boardId) => {
              document.getElementById(boardId).querySelector(`.square-${losingKing}`)?.classList.add("losing-king");
            });
          }
        }
      }

      function paintLastMove() {
        document.querySelectorAll(".last-move").forEach((square) => {
          square.classList.remove("last-move");
        });

        const history = game.history({ verbose: true });
        const lastMove = history[history.length - 1];
        if (!lastMove) return;

        boardIds.forEach((boardId) => {
          const boardRoot = document.getElementById(boardId);
          boardRoot.querySelector(`.square-${lastMove.from}`)?.classList.add("last-move");
          boardRoot.querySelector(`.square-${lastMove.to}`)?.classList.add("last-move");
        });
      }

      function paintBoardState() {
        paintGameMarkers();
        paintLastMove();
      }

      function renderCapturedPieces() {
        const captures = { w: [], b: [] };
        game.history({ verbose: true }).forEach((move) => {
          if (!move.captured) return;
          const capturedColor = move.color === "w" ? "b" : "w";
          captures[move.color].push({
            color: capturedColor,
            type: move.captured,
            code: `${capturedColor}${move.captured.toUpperCase()}`
          });
        });

        ["w", "b"].forEach((capturingColor) => {
          const direction = capturingColor === "w" ? 1 : -1;
          const orderedCaptures = [...captures[capturingColor]].sort(
            (first, second) => direction * (pieceValueOrder.indexOf(first.type) - pieceValueOrder.indexOf(second.type))
          );
          const markup = orderedCaptures
            .map(({ color, type, code }) => {
              const src = pieceTheme.replace("{piece}", code);
              const colorName = color === "w" ? "white" : "black";
              return `<img class="captured-piece-image" src="${src}" alt="Captured ${colorName} ${pieceNames[type]}">`;
            })
            .join("");
          const content = markup || '<span class="captures-empty">—</span>';
          const suffix = capturingColor === "w" ? "WhiteCaptures" : "BlackCaptures";
          boardIds.forEach((boardId) => {
            document.getElementById(`${boardId}${suffix}`).innerHTML = content;
          });
        });
      }

      function handleSquareTap(square, boardId) {
        if (selectedBoardId === boardId && selectedSquare && legalTargets.some((move) => move.to === square)) {
          completeMove(selectedSquare, square);
          return;
        }

        if (selectedBoardId === boardId && square === selectedSquare) {
          selectedSquare = null;
          selectedBoardId = null;
          legalTargets = [];
          paintHighlights();
          return;
        }

        selectSquare(square, boardId);
      }

      function rotationForBoard(boardRoot) {
        const shell = boardRoot.closest(".board-shell");
        if (shell.classList.contains("rotate-90")) return 90;
        if (shell.classList.contains("rotate-neg-90")) return 270;
        if (shell.classList.contains("rotate-180")) return 180;
        return 0;
      }

      function canDragPiece(square) {
        const piece = game.get(square);
        return piece && piece.color === game.turn() && !game.game_over();
      }

      function positionDraggedPiece(clientX, clientY) {
        if (!pointerDrag?.ghost) return;
        pointerDrag.ghost.style.left = `${clientX - pointerDrag.size / 2}px`;
        pointerDrag.ghost.style.top = `${clientY - pointerDrag.size / 2}px`;
      }

      function beginPointerDrag(event) {
        const pieceImage = pointerDrag.squareElement.querySelector("img");
        if (!pieceImage) return;

        const pieceRect = pieceImage.getBoundingClientRect();
        const ghost = pieceImage.cloneNode(true);
        ghost.className = "dragged-piece";
        ghost.style.width = `${pieceRect.width}px`;
        ghost.style.height = `${pieceRect.height}px`;
        ghost.style.transform = `rotate(${pointerDrag.rotation}deg)`;
        document.body.appendChild(ghost);

        pointerDrag.dragging = true;
        pointerDrag.ghost = ghost;
        pointerDrag.pieceImage = pieceImage;
        pointerDrag.size = pieceRect.width;
        pieceImage.style.visibility = "hidden";
        selectSquare(pointerDrag.source, pointerDrag.boardRoot.id);
        positionDraggedPiece(event.clientX, event.clientY);
      }

      function finishPointerDrag(targetSquare) {
        const drag = pointerDrag;
        pointerDrag = null;
        if (!drag) return;

        drag.ghost?.remove();
        if (drag.pieceImage) drag.pieceImage.style.visibility = "";
        if (drag.dragging && targetSquare) completeMove(drag.source, targetSquare);
      }

      function onPointerDown(event) {
        if (!event.isPrimary || event.button > 0) return;
        const squareElement = event.target.closest(".square-55d63");
        if (!squareElement) return;

        const source = squareFromElement(squareElement);
        pointerDrag = {
          pointerId: event.pointerId,
          source,
          squareElement,
          boardRoot: event.currentTarget,
          startX: event.clientX,
          startY: event.clientY,
          rotation: rotationForBoard(event.currentTarget),
          dragging: false,
          ghost: null,
          pieceImage: null,
          size: 0
        };
        event.currentTarget.setPointerCapture(event.pointerId);
      }

      function onPointerMove(event) {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const distance = Math.hypot(
          event.clientX - pointerDrag.startX,
          event.clientY - pointerDrag.startY
        );

        if (!pointerDrag.dragging && distance > 6 && canDragPiece(pointerDrag.source)) {
          beginPointerDrag(event);
        }
        if (pointerDrag.dragging) {
          event.preventDefault();
          positionDraggedPiece(event.clientX, event.clientY);
        }
      }

      function onPointerUp(event) {
        if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
        const drag = pointerDrag;

        if (!drag.dragging) {
          pointerDrag = null;
          handleSquareTap(drag.source, drag.boardRoot.id);
          return;
        }

        const targetElement = document.elementFromPoint(event.clientX, event.clientY);
        const targetSquare = targetElement ? squareFromElement(targetElement) : null;
        const targetBoard = targetElement?.closest(".board");
        finishPointerDrag(targetBoard === drag.boardRoot ? targetSquare : null);
      }

      function onPointerCancel(event) {
        if (pointerDrag?.pointerId === event.pointerId) finishPointerDrag(null);
      }

      function createBoards() {
        const config = {
          position: "start",
          draggable: false,
          pieceTheme,
          showNotation: true
        };
        boards = [
          Chessboard("boardLeft", { ...config, orientation: "white" }),
          Chessboard("boardRight", { ...config, orientation: "black" })
        ];
        boardIds.forEach((id) => {
          const boardRoot = document.getElementById(id);
          boardRoot.addEventListener("pointerdown", onPointerDown);
          boardRoot.addEventListener("pointermove", onPointerMove);
          boardRoot.addEventListener("pointerup", onPointerUp);
          boardRoot.addEventListener("pointercancel", onPointerCancel);
        });
      }

      let resizeFrame = null;

      function resizeLayout() {
        window.cancelAnimationFrame(resizeFrame);
        resizeFrame = window.requestAnimationFrame(() => {
          const controls = [
            document.querySelector(".topbar"),
            document.querySelector(".control-deck"),
            document.querySelector(".mode-row")
          ];
          const controlsBottom = Math.max(...controls.map((element) => element.getBoundingClientRect().bottom));
          const availableHeight = Math.max(1, window.innerHeight - controlsBottom - 6);
          const capturesWidth = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--captures-width")) || 0;
          const boardSize = Math.floor(Math.min((window.innerWidth - capturesWidth * 2) / 2, availableHeight));

          document.documentElement.style.setProperty("--board-size", `${boardSize}px`);
          boards.forEach((board) => board.resize());
        });
      }

      function applyLayout(nextLayout) {
        layout = nextLayout;
        elements.leftShell.className = "board-shell";
        elements.rightShell.className = "board-shell";

        if (layout === "opposed") {
          elements.rightShell.classList.add("rotate-180");
          elements.leftCaptures.style.setProperty("--piece-rotation", "0deg");
          elements.rightCaptures.style.setProperty("--piece-rotation", "180deg");
        } else {
          elements.leftShell.classList.add("rotate-90");
          elements.rightShell.classList.add("rotate-neg-90");
          elements.leftCaptures.style.setProperty("--piece-rotation", "90deg");
          elements.rightCaptures.style.setProperty("--piece-rotation", "270deg");
        }

        document.querySelectorAll(".segment").forEach((button) => {
          button.classList.toggle("active", button.dataset.layout === layout);
        });
      }

      function applySidePositions() {
        boards[0].orientation(sidesSwapped ? "black" : "white");
        boards[1].orientation(sidesSwapped ? "white" : "black");
        elements.whiteClock.style.order = sidesSwapped ? 3 : 1;
        elements.blackClock.style.order = sidesSwapped ? 1 : 3;
        elements.leftCaptures.classList.toggle("colors-swapped", sidesSwapped);
        elements.rightCaptures.classList.toggle("colors-swapped", sidesSwapped);
        elements.swapSides.setAttribute("aria-pressed", String(sidesSwapped));
        window.setTimeout(() => {
          paintHighlights();
          paintBoardState();
        }, 0);
      }

      function toggleSidePositions() {
        sidesSwapped = !sidesSwapped;
        applySidePositions();
      }

      function getSelectedTime() {
        if (elements.timeMode.value === "custom") {
          const minutes = Math.max(1, Math.min(180, Number(elements.customMinutes.value) || 1));
          const increment = Math.max(0, Math.min(60, Number(elements.customIncrement.value) || 0));
          return { initialMs: minutes * 60 * 1000, incrementMs: increment * 1000 };
        }

        const [minutes, increment] = elements.timeMode.value.split("|").map(Number);
        return { initialMs: minutes * 60 * 1000, incrementMs: increment * 1000 };
      }

      function resetClock() {
        stopClock();
        const selected = getSelectedTime();
        clock.initialMs = selected.initialMs;
        clock.incrementMs = selected.incrementMs;
        clock.remaining = { w: selected.initialMs, b: selected.initialMs };
        clock.flagged = { w: false, b: false };
        clock.active = null;
        clock.started = false;
        clock.lastTick = null;
        elements.pauseClock.textContent = "Ⅱ";
        elements.pauseClock.setAttribute("aria-label", "Pause clock");
        renderClock();
      }

      function startClock(color) {
        if (clock.flagged.w || clock.flagged.b) return;
        clock.active = color;
        clock.running = true;
        clock.started = true;
        clock.lastTick = performance.now();
        if (!clock.timer) clock.timer = window.setInterval(tickClock, 100);
        elements.pauseClock.textContent = "Ⅱ";
        elements.pauseClock.setAttribute("aria-label", "Pause clock");
        renderClock();
      }

      function stopClock() {
        if (clock.running) tickClock();
        clock.running = false;
        clock.lastTick = null;
        if (clock.timer) {
          window.clearInterval(clock.timer);
          clock.timer = null;
        }
        renderClock();
      }

      function tickClock() {
        if (!clock.running || !clock.active || clock.lastTick === null) return;
        const now = performance.now();
        const elapsed = now - clock.lastTick;
        clock.lastTick = now;
        clock.remaining[clock.active] = Math.max(0, clock.remaining[clock.active] - elapsed);
        if (clock.remaining[clock.active] === 0) {
          clock.flagged[clock.active] = true;
          clock.running = false;
          clock.lastTick = null;
          window.clearInterval(clock.timer);
          clock.timer = null;
          elements.pauseClock.textContent = "■";
          elements.pauseClock.setAttribute("aria-label", "Clock stopped");
        }
        renderClock();
      }

      function advanceClock(movingColor) {
        if (clock.flagged.w || clock.flagged.b) return;
        if (!clock.started) {
          startClock(game.turn());
          return;
        }

        tickClock();
        if (clock.flagged.w || clock.flagged.b) return;
        clock.remaining[movingColor] += clock.incrementMs;
        startClock(game.turn());
      }

      function toggleClock() {
        if (!clock.started || clock.flagged.w || clock.flagged.b) return;
        if (clock.running) {
          stopClock();
          elements.pauseClock.textContent = "▶";
          elements.pauseClock.setAttribute("aria-label", "Resume clock");
        } else {
          startClock(clock.active || game.turn());
        }
      }

      function formatTime(milliseconds) {
        const safeMs = Math.max(0, milliseconds);
        if (safeMs < 10000) {
          const seconds = Math.floor(safeMs / 1000);
          const tenths = Math.floor((safeMs % 1000) / 100);
          return `0:${String(seconds).padStart(2, "0")}.${tenths}`;
        }
        const totalSeconds = Math.ceil(safeMs / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function renderClock() {
        elements.whiteTime.textContent = formatTime(clock.remaining.w);
        elements.blackTime.textContent = formatTime(clock.remaining.b);
        const whiteRatio = Math.max(0, Math.min(1, clock.remaining.w / clock.initialMs));
        const blackRatio = Math.max(0, Math.min(1, clock.remaining.b / clock.initialMs));
        elements.whiteClock.style.setProperty("--time-ratio", whiteRatio);
        elements.blackClock.style.setProperty("--time-ratio", blackRatio);
        elements.whiteClock.classList.toggle("active", clock.running && clock.active === "w");
        elements.blackClock.classList.toggle("active", clock.running && clock.active === "b");
        elements.whiteClock.classList.toggle("flagged", clock.flagged.w);
        elements.blackClock.classList.toggle("flagged", clock.flagged.b);
      }

      function updateStatus() {
        window.setTimeout(paintBoardState, 0);
        renderCapturedPieces();
        if (game.in_checkmate()) {
          stopClock();
        } else if (game.in_draw()) {
          stopClock();
        }
      }

      function restartGame() {
        game.reset();
        selectedSquare = null;
        selectedBoardId = null;
        legalTargets = [];
        boards.forEach((board) => board.start(false));
        clearHighlights();
        resetClock();
        updateStatus();
      }

      document.querySelectorAll(".segment").forEach((button) => {
        button.addEventListener("click", () => applyLayout(button.dataset.layout));
      });
      document.getElementById("restartGame").addEventListener("click", restartGame);
      elements.swapSides.addEventListener("click", toggleSidePositions);
      document.getElementById("resetClock").addEventListener("click", resetClock);
      elements.fullscreenButton.addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", () => {
        updateFullscreenButton();
        resizeLayout();
      });
      elements.pauseClock.addEventListener("click", toggleClock);
      elements.timeMode.addEventListener("change", () => {
        elements.customTime.classList.toggle("visible", elements.timeMode.value === "custom");
        resetClock();
      });
      [elements.customMinutes, elements.customIncrement].forEach((input) => {
        input.addEventListener("change", resetClock);
      });
      window.addEventListener("resize", resizeLayout);
      window.visualViewport?.addEventListener("resize", resizeLayout);

      createBoards();
      applyLayout("opposed");
      applySidePositions();
      updateFullscreenButton();
      resetClock();
      updateStatus();
      resizeLayout();

      const layoutObserver = new ResizeObserver(resizeLayout);
      [".topbar", ".control-deck", ".mode-row"].forEach((selector) => {
        layoutObserver.observe(document.querySelector(selector));
      });
      document.fonts?.ready.then(resizeLayout);
    });
  </script>
</body>
</html>
